[project]
name = "trade-alert"
version = "0.1.0"
description = "Telegram queue alerts with private, channel and composite rules"
requires-python = ">=3.14"
dependencies = ["tzdata==2026.5", "httpx==0.28.1", "Telethon==1.45.0"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["trade_alert"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true
